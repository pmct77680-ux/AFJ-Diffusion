<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catalogue AFJ Diffusion</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Catalogue AFJ Diffusion</h1>
      <p class="subtitle">Catalogue en ligne - Base propre pour GitHub Pages</p>
    </div>
  </header>

  <main class="container">
    <section id="catalogue" aria-label="Liste des produits">
      <!-- Exemple de produit -->
      <article class="product-card">
        <img class="product-image" src="assets/images/example-1.jpg" alt="Produit exemple A">
        <h2 class="product-title">Produit Exemple A</h2>
        <p class="product-desc">Description courte du produit A.</p>
        <p class="product-price">Prix: 19,90 €</p>
      </article>

      <article class="product-card">
        <img class="product-image" src="assets/images/example-2.jpg" alt="Produit exemple B">
        <h2 class="product-title">Produit Exemple B</h2>
        <p class="product-desc">Description courte du produit B.</p>
        <p class="product-price">Prix: 29,90 €</p>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; AFJ Diffusion</p>
    </div>
  </footer>

  <script>
    // Petit script pour afficher l'image en grand (modal simple)
    document.addEventListener('click', function (e) {
      if (e.target.matches('.product-image')) {
        const src = e.target.getAttribute('src');
        const alt = e.target.getAttribute('alt') || '';
        const modal = document.createElement('div');
        modal.style.position = 'fixed';
        modal.style.top = 0;
        modal.style.left = 0;
        modal.style.width = '100%';
        modal.style.height = '100%';
        modal.style.background = 'rgba(0,0,0,0.8)';
        modal.style.display = 'flex';
        modal.style.alignItems = 'center';
        modal.style.justifyContent = 'center';
        modal.innerHTML = '<img src=\"'+src+'\" alt=\"'+alt+'\" style=\"max-width:90%; max-height:90%; border-radius:6px;\">';
        modal.addEventListener('click', () => modal.remove());
        document.body.appendChild(modal);
      }
    });
  </script>
</body>
</html>
