<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AFJ Diffusion - Catalogue 2027</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee+Inline&display=swap">
<style>
:root{--fg:#000;--bg:#fff;--red:#d3241a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#000;font:16px/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif}
.ttl{font-family:"Bungee Inline",Impact,"Arial Black",sans-serif;text-transform:uppercase;font-weight:400}
header{border:4px solid #000;border-radius:6px;margin:16px;padding:20px 14px;text-align:center}
header h1{margin:0;font-size:clamp(1.5rem,6.5vw,3rem);line-height:1.1}
.intro{max-width:720px;margin:16px auto;text-align:center;font-size:.95rem}
.intro img{width:min(320px,80%);height:auto;display:block;margin:0 auto 8px}
.intro u{text-decoration:underline}
.spec{max-width:520px;margin:12px auto 0;font-size:.9rem}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:#fff;border-bottom:3px solid #000;padding:8px 12px;display:flex;gap:8px;overflow-x:auto;z-index:5}
nav a{white-space:nowrap;color:#000;text-decoration:none;border:2px solid #000;border-radius:4px;padding:4px 10px;font-size:.85rem;font-weight:700;text-transform:uppercase}
nav a:hover{background:#000;color:#fff}
main{max-width:960px;margin:0 auto;padding:16px}
#q{width:100%;padding:12px;font-size:1rem;border:3px solid #000;border-radius:4px}
section{margin:36px 0}
h2{text-align:center;font-size:clamp(1.3rem,5vw,2rem);margin:0 0 14px;text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
h3{margin:18px 0 6px;font-size:.95rem;font-weight:700;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0;padding:0;margin:0;list-style:none;border-top:2px solid #000;border-left:2px solid #000}
.grid li{border-right:2px solid #000;border-bottom:2px solid #000;padding:7px 10px;font-size:.9rem;font-weight:700}
.note{color:var(--red);font-weight:700;margin:10px 0;font-size:.92rem}
.hide{display:none!important}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin:0 0 18px;align-items:start}
.gal img{width:100%;height:auto;display:block;border:2px solid #000}
#contact{text-align:center}
.bubble{display:inline-block;border:3px solid #000;border-radius:40px;padding:10px 26px;margin:6px;font-weight:800;font-size:.9rem;color:#000;text-decoration:none;text-transform:uppercase}
footer{text-align:center;padding:24px 16px;font-size:.8rem;border-top:3px solid #000}
</style>
</head>
