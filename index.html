<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catalogue AFJ Diffusion</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Catalogue AFJ Diffusion</h1>
      <p class="subtitle">Catalogue en ligne - Exemple pour débutant</p>
    </div>
  </header>

  <main class="container">
    <section id="catalogue">
      <!-- Exemple de produit 1 -->
      <article class="product-card">

        <h2 class="product-title">Produit Exemple A</h2>
        <p class="product-desc">Description courte du produit A. Idéal pour démonstration.</p>
        <p class="product-price">Prix: 19,90 €</p>
      </article>

      <!-- Exemple de produit 2 -->
      <article class="product-card">
        <img class="product-image" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMgAAADICAYAAACtWK6eAAAACXBIWXMAAAsSAAALEgHS3X78AAABF0lEQVR4nO3QsQkAQBhE0Xf/6XcGm0Qw2gq4s3m5nJ2Z2dnZ2dnZ2dnZ2drY/8jv2gAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgP4F8gABY6FX1wAAAABJRU5ErkJggg==" alt="Image exemple">
        <h2 class="product-title">Produit Exemple B</h2>
        <p class="product-desc">Description courte du produit B. Utile pour tester le layout.</p>
        <p class="product-price">Prix: 29,90 €</p>
      </article>

      <!-- Ajoutez d'autres produits ici en copiant l'article ci-dessus -->
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; AFJ Diffusion - Catalogue - Exemple</p>
    </div>
  </footer>

  <script>
    // Script simple: cliquer sur une image ouvre un modal basique
    document.addEventListener('click', function (e) {
      if (e.target.matches('.product-image')) {
        const src = e.target.getAttribute('src');
        const modal = document.createElement('div');
        modal.style.position = 'fixed';
        modal.style.top = 0;
        modal.style.left = 0;
        modal.style.width = '100%';
        modal.style.height = '100%';
        modal.style.background = 'rgba(0,0,0,0.8)';
        modal.style.display = 'flex';
        modal.style.alignItems = 'center';
        modal.style.justifyContent = 'center';
        modal.innerHTML = '<img src="'+src+'" style="max-width:90%; max-height:90%; border-radius:6px;">';
        modal.addEventListener('click', () => modal.remove());
        document.body.appendChild(modal);
      }
    });
  </script>
</body>
</html>
